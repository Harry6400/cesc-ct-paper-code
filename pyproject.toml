[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cesc-ct-reference"
version = "0.31.1.post1"
description = "Fixed-backbone conditional error-statistics correction for CT: research reference"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24"]
[project.optional-dependencies]
test = ["pytest>=8"]
logging = ["tensorboard>=2.15"]
figures = ["cairosvg>=2.7", "Pillow>=10"]
[tool.setuptools.packages.find]
include = ["cesc*", "bridges*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
